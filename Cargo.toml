[package]
name = "llm-duo"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Run one llama-server, KoboldCpp or vLLM server per GPU from a two-pane KDE Plasma (Qt 6 / Kirigami) GUI"
license = "MIT"
publish = false

[[bin]]
name = "llm-duo"
path = "src/main.rs"

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"
regex = "1"
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
